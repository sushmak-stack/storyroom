<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storyroom · GRT Jewellers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1112;--panel:#241617;--panel2:#2f1c1e;--line:#4d3335;--text:#FFF7DE;--muted:#b9a493;--acc:#B8292F;--acc2:#f2b8bb;--gold:#e3c27a;--ok:#7fd3a0;--rev:#e3c27a;--yog:#f2b8bb;--bad:#ff8a8a;--serif:'Cormorant Garamond',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Manrope,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:#681015}
.brand{font-weight:800;letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:18px;height:12px;border:2px solid var(--gold);border-radius:2px;display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;left:3px;top:2px;width:6px;height:4px;background:var(--gold)}
.crumb{color:#e8cfc4;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--text);font-weight:600}
.topActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:#454b55}
button.primary{background:var(--acc);color:#FFF7DE;border-color:var(--acc);font-weight:700}
button.primary:hover:not(:disabled){background:#cf3a40}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;color:var(--text);background:#0f1114;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical}
input[type=range]{padding:0;accent-color:var(--acc)}
.lbl{display:flex;justify-content:space-between;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 0 6px}
.sec{font-weight:700;font-size:13px;margin:22px 0 4px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.sec span{font-weight:400;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>button{flex:1}
.hidden{display:none!important}
.banner{padding:8px 16px;background:#3a2410;color:var(--gold);font-size:13px;border-bottom:1px solid #5a3a1a}
/* home */
.home{flex:1;overflow:auto;padding:32px clamp(16px,4vw,48px)}
.homeHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.homeHead h1{margin:0 0 4px;font:700 38px/1.05 var(--serif);letter-spacing:.005em}
.homeHead p{margin:0;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.pthumb{aspect-ratio:16/9;background:radial-gradient(circle at 50% 40%,#4a2124,#2a1b1c 70%);display:flex;align-items:center;justify-content:center;position:relative}
.pthumb .ar{position:absolute;top:8px;left:8px;font:11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:#0c0d0f}
.pthumb .ini{font:700 34px var(--serif);color:#7a4f4f;letter-spacing:.04em}
.pmeta{padding:10px 12px 12px}
.pmeta b{display:block;font-size:15px}
.pmeta span{color:var(--muted);font-size:12px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--muted)}
/* project */
.project{flex:1;display:grid;grid-template-columns:290px minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr) 196px auto;min-height:0}
.meter{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:7px 16px;border-top:1px solid var(--line);background:#120a0b;font:11.5px var(--mono);color:var(--muted)}
.meter .bar{width:140px;height:6px;border-radius:3px;background:#2f1c1e;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--gold)}
.meter .bar.hot i{background:var(--bad)}
.meter b{color:var(--text);font-weight:500}
.meter .sp{flex:1}
.meter button{font:11px var(--mono);padding:3px 8px}
.brief,.inspector{overflow:auto;padding:4px 16px 20px;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.inspector{border-right:0;border-left:1px solid var(--line)}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px 18px 10px;gap:10px}
.viewerWrap{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.viewer{position:relative;width:min(100cqw,calc(100cqh * var(--ar)));aspect-ratio:var(--arr);background:#08090a;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.viewer.drop{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.viewer img.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewer svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:20px}
.ph b{color:var(--text);font-size:18px}
.vb{position:absolute;font:11px var(--mono);background:rgba(8,9,10,.72);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:3px 7px;color:#ddd;backdrop-filter:blur(4px)}
.vb.tl{top:8px;left:8px}.vb.tr{top:8px;right:8px;color:var(--gold)}
.vb.bl{bottom:8px;left:8px;background:var(--gold);color:#1b1112;font-weight:600}
.vcap{position:absolute;left:8%;right:8%;bottom:6%;text-align:center;font-weight:600;font-size:clamp(11px,1.6cqw,17px);text-shadow:0 1px 3px #000,0 0 12px #000}
.vnav{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.vnav .ct{font:12px var(--mono);color:var(--muted);min-width:110px;text-align:center}
.tog.on{border-color:var(--acc);color:var(--acc2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 9px;border-radius:999px;font-size:12px;background:#101216;border:1px solid var(--line);color:#cfd2d8}
.chip.on{background:var(--acc);color:#FFF7DE;border-color:var(--acc);font-weight:700}
.insHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 2px}
.insHead b{font:700 22px var(--serif)}
.insHead select{width:auto}
pre.prompt{white-space:pre-wrap;font:12px/1.5 var(--mono);background:#0f1114;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0;color:#cfd2d8;max-height:180px;overflow:auto}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
/* scenebuilder */
.sb{grid-column:1/-1;border-top:1px solid var(--line);background:#160d0e;display:flex;flex-direction:column;min-height:0;padding:10px 16px 8px}
.sbHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sbHead b{font-size:14px}
.sbHead .sp{flex:1}
.track{flex:1;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:10px 0 4px;align-items:stretch;min-height:0}
.clip{flex:none;border-radius:8px;border:1px solid var(--line);background:var(--panel);overflow:hidden;position:relative;cursor:pointer;display:flex;flex-direction:column;user-select:none}
.clip.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.clip.dragging{opacity:.4}
.clip.dropB{box-shadow:-4px 0 0 var(--acc)}
.clip.dropA{box-shadow:4px 0 0 var(--acc)}
.clip .th{flex:1;background:#08090a;position:relative;overflow:hidden}
.clip .th img{width:100%;height:100%;object-fit:cover;display:block}
.clip .num{position:absolute;top:4px;left:5px;font:600 11px var(--mono);background:rgba(0,0,0,.65);border-radius:3px;padding:0 4px}
.clip .mv{position:absolute;top:4px;right:5px;font:11px var(--mono);color:var(--gold);background:rgba(0,0,0,.65);border-radius:3px;padding:0 4px}
.clip .act{position:absolute;inset:auto 5px 4px 5px;font-size:10.5px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .cap{font:11px var(--mono);padding:4px 7px;display:flex;justify-content:space-between;color:var(--muted);gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:#666}
.dot.internal{background:#8fa6d8}.dot.yogesh{background:var(--yog)}.dot.approved{background:var(--ok)}
.qc{display:inline-block;font:600 10px var(--mono);letter-spacing:.06em;color:#1b1112;background:var(--gold);border-radius:3px;padding:1px 5px}
.clip .qc{position:absolute;bottom:4px;right:5px}
.warn{color:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pcell{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#1b1112}
.pcell .pimg{aspect-ratio:1;background:#1b1112 center/cover no-repeat}
.pcell .pno{position:absolute;top:4px;left:4px;font:600 10px var(--mono);background:var(--gold);color:#1b1112;border-radius:3px;padding:0 4px}
.pcell .pdel{position:absolute;top:2px;right:2px;padding:0 6px;font-size:12px;background:rgba(0,0,0,.6);border:0}
.pcell input{border:0;border-top:1px solid var(--line);border-radius:0;padding:5px 6px;font-size:11px;background:#160d0e}
.tprod{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px}
.tprod i{width:20px;height:20px;border-radius:4px;background:#1b1112 center/cover;display:inline-block}
.flag{font-size:12px;color:var(--gold);background:#3a2410;border:1px solid #5a3a1a;border-radius:6px;padding:6px 8px;margin-top:6px}
.clip .cf{position:absolute;bottom:4px;left:5px;font:600 10px var(--mono);color:#1b1112;background:var(--gold);border-radius:3px;padding:0 4px}
a.btnlink{display:inline-block;text-align:center;font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;text-decoration:none;white-space:nowrap}
a.btnlink.primary{background:var(--acc);border-color:var(--acc);color:#FFF7DE;font-weight:700;flex:1}
a.btnlink:hover{border-color:#6a4a4c}
.infl{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.infl .pic{width:72px;height:90px;flex:none;border-radius:8px;border:1px solid var(--line);background:#1b1112 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center}
.infl .col{flex:1;display:flex;flex-direction:column;gap:6px}
a.lnk{color:var(--gold)}
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.pmeta .tag{display:inline-block;font:11px var(--mono);color:var(--gold);margin-bottom:3px}
.addClip{flex:none;width:70px;font-size:22px;color:var(--muted);border-style:dashed;background:transparent}
/* present */
.present{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.pframe{position:relative;background:#0a0a0a;overflow:hidden;border-radius:4px}
.pframe img{width:100%;height:100%;object-fit:cover;display:block}
.pcap{position:absolute;left:6%;right:6%;bottom:6%;text-align:center;font-weight:700;font-size:clamp(14px,2.2vw,26px);text-shadow:0 2px 4px #000,0 0 18px #000}
.pbar{display:flex;gap:3px;width:min(92vw,1100px)}
.pbar div{height:4px;background:#333;border-radius:2px;overflow:hidden}
.pbar div i{display:block;height:100%;background:var(--gold);width:0}
.pctl{display:flex;gap:8px;align-items:center;color:var(--muted);font:12px var(--mono)}
/* modal & toast */
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;width:min(560px,100%);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:19px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#22252b;border:1px solid var(--line);border-radius:10px;padding:10px 16px;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1050px){.project{grid-template-columns:240px minmax(0,1fr) 290px}}
@media (max-width:820px){.project{display:flex;flex-direction:column;overflow:auto}.brief,.inspector{border:0;overflow:visible}.stage{min-height:60vh}.sb{min-height:200px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" id="homeBtn"><i></i>Storyroom <span style="font:600 13px var(--mono);color:var(--gold);letter-spacing:.08em">· GRT</span></div>
    <div class="crumb" id="crumb"></div>
    <div class="topActions" id="topActions"></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="home" class="home"></main>
  <main id="project" class="project hidden">
    <aside class="brief" id="briefPane"></aside>
    <section class="stage">
      <div class="viewerWrap"><div class="viewer" id="viewer"></div></div>
      <div class="vnav" id="vnav"></div>
    </section>
    <aside class="inspector" id="inspector"></aside>
    <footer class="sb" id="sb"></footer>
    <div class="meter" id="meter"></div>
  </main>
</div>
<div id="present" class="present hidden"></div>
<div id="modal" class="modalBack hidden"></div>
<div id="toast" class="toast"></div>
<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const SIZES=["Macro","Extreme wide","Wide","Full","Medium","Medium close-up","Close-up","Extreme close-up","Insert"];
const ANGLES=["Eye level","Low angle","High angle","Overhead","Dutch tilt","Over the shoulder","POV"];
const MOVES=["Static","Pan left","Pan right","Tilt up","Tilt down","Dolly in","Dolly out","Truck left","Truck right","Crane up","Crane down","Orbit","Handheld","Drone / aerial","Zoom in","Rack focus","Turntable 360","Light sweep"];
const LENSES=[16,24,35,50,85,100,135];
const ICON={"Static":"■","Pan left":"←","Pan right":"→","Tilt up":"↑","Tilt down":"↓","Dolly in":"⇥","Dolly out":"⇤","Truck left":"⇠","Truck right":"⇢","Crane up":"⇡","Crane down":"⇣","Orbit":"↻","Handheld":"≈","Drone / aerial":"✈","Zoom in":"⊕","Rack focus":"◎","Turntable 360":"⟳","Light sweep":"✧"};
const ASPECTS={"16:9":[1600,900],"9:16":[900,1600],"1:1":[1200,1200],"4:5":[1080,1350]};
const STATUS={draft:"Draft",internal:"Internal review",yogesh:"⚑ With Yogesh",approved:"Approved by Yogesh"};
const PRODUCTS=["Gold","Diamond","Silver","Silver Articles"];
const KINDS={bau:"BAU row",topical:"Festival topical"};
const TIERS={1:"Tier 1 · 3 statics + 1 video",2:"Tier 2 · 1 static + 1 video",3:"Tier 3 · 1 story"};
const PRODUCT_CAST={"Gold":"GRT 22K gold jewellery: necklace, bangles or jhumkas as the hero. Model in a silk saree, South Indian, warm and graceful.","Diamond":"GRT diamond jewellery: solitaire ring, pendant or studs as the hero. Contemporary South Indian woman, modern occasion styling.","Silver":"GRT silver jewellery: anklets, chains, toe rings or oxidised pieces as the hero. Young, everyday styling.","Silver Articles":"GRT silver articles: pooja items, kuthuvilakku, plates, gift sets as the hero. Home and festive gifting setting."};
const DEFAULT_STYLE="Premium festive South Indian jewellery film. Warm key light with crisp specular sparkle on metal and stones, soft falloff, rich shadows. Cream, maroon and gold palette. Uncluttered, product always readable.";
const QC_RE=/(\d|₹|%|\brs\.?\b|carat|\bct\b|\bgms?\b|gram|offer|\boff\b|\bfree\b|making charge|discount|guarantee|warranty|\bbis\b|hallmark|purity|22k|18k|24k|cashback|\bemi\b|t&c|\*)/i;
function needsQC(s){return QC_RE.test((s.vo||"")+" "+(s.dlg||""))}
function grtTemplate(product){const P=product||"Gold";const hero={"Gold":"gold necklace","Diamond":"diamond solitaire","Silver":"silver anklet","Silver Articles":"silver kuthuvilakku"}[P]||"jewellery";return[
 {action:`Black-to-light open: a slow light sweep travels across the ${hero}, sparkle catches on the edges.`,vo:"",size:"Macro",angle:"Eye level",move:"Light sweep",lens:100,duration:3},
 {action:`The ${hero} on a cream plinth against maroon, rotating to show craftsmanship from every side.`,vo:"",size:"Close-up",angle:"Low angle",move:"Turntable 360",lens:85,duration:5},
 {action:P==="Silver Articles"?`Hands place the ${hero} on the pooja shelf and light it; warm glow blooms across the silver.`:`Model's hand / neckline reveal: she adjusts the ${hero}, a small private smile.`,vo:"",size:"Medium close-up",angle:"Eye level",move:"Dolly in",lens:50,duration:6},
 {action:`Extreme detail of texture and finish: filigree, setting or engraving in crisp focus.`,vo:"",size:"Extreme close-up",angle:"High angle",move:"Rack focus",lens:100,duration:4},
 {action:`Occasion moment: family or festive setting, the ${hero} catches the light as she turns.`,vo:"",size:"Medium",angle:"Eye level",move:"Orbit",lens:35,duration:6},
 {action:`End frame: ${hero} hero on cream with GRT logo and super in the copy space.`,vo:"GRT Jewellers. (super to be written)",size:"Close-up",angle:"Eye level",move:"Static",lens:85,duration:4}
].map(normShot)}
const S={products:[],db:null,sample:null,projects:null,pid:null,project:null,shots:[],shotsLoaded:false,sel:null,unsub:[],pending:{},projPending:false,guides:true,overlay:true,busy:{},dragId:null};
let Store=null;

/* ---------- helpers ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3200)}
function banner(m){const b=$("#banner");if(!m){b.classList.add("hidden");return}b.textContent=m;b.classList.remove("hidden")}
function strip(o){const c=Object.assign({},o);delete c.id;return c}
function fmtTime(sec){sec=Math.round(sec||0);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function ago(ts){if(!ts)return"";const d=(Date.now()-ts)/1000;if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago"}
function arOf(p){return ASPECTS[(p&&p.aspect)||"16:9"]||ASPECTS["16:9"]}
function runtime(){return S.shots.reduce((a,s)=>a+(+s.duration||0),0)}
function pick(v,list,def){return list.includes(v)?v:def}
function frameSrc(s){
  if(s.image&&/^data:image\/(jpeg|png|webp);/.test(s.image))return s.image;
  if(s.sketch)return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s.sketch);
  return "";
}
function isTyping(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")}
async function copyText(text,label){
  try{await navigator.clipboard.writeText(text);toast((label||"Copied")+" to clipboard")}
  catch(e){openModal(`<h2>${esc(label||"Copy")}</h2><p class="muted small">Your browser blocked the clipboard. Select all and copy.</p><textarea rows="12" id="copyArea">${esc(text)}</textarea><div class="row"><button data-close>Close</button></div>`);const a=$("#copyArea");a.focus();a.select()}
}
function writeErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument")toast("Couldn't save. You may have view-only access, or the frame is too large.");
  else if(c==="quota_exceeded")toast("Storage is full. Delete old projects or frames to keep saving.");
  else if(c==="resource_exhausted")toast("Saving too fast. Give it a second.");
  else if(c==="revoked")toast("Access changed. Reload to continue.");
  else toast("Couldn't save just now. Try again.");
  return false;
}

/* ---------- stores ---------- */
const chains={};
function queued(path,fn){const p=(chains[path]||Promise.resolve()).then(fn).then(()=>true,writeErr);chains[path]=p;return p}
const DBStore={
  subProjects(cb,err){return S.db.collection("projects").orderBy("updatedAt","desc").onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data())),s.metadata),err)},
  subProject(pid,cb,err){return S.db.doc("projects/"+pid).onSnapshot(s=>cb(s.exists?Object.assign({id:s.id},s.data()):null,s.metadata),err)},

function cleanSVG(txt){

  if(doc.querySelector("parsererror"))return null;
  doc.querySelectorAll("script,foreignObject,image,iframe,use,a,style,animate,set").forEach(n=>n.remove());
  doc.querySelectorAll("*").forEach(n=>{[...n.attributes].forEach(at=>{if(/^on/i.test(at.name)||/href$/i.test(at.name))n.removeAttribute(at.name)})});
  const svg=doc.documentElement;if(svg.nodeName.toLowerCase()!=="svg")return null;
  svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
  const out=new XMLSerializer().serializeToString(svg);
  return out.length<150000?out:null;
}

const RATE_IN=2,RATE_OUT=10;            // USD per million tokens, Claude Sonnet 5.5 list price

const LIMIT_INR=500;                    // hard Claude budget per project, in rupees
const KIND={sketch:"Sketch frame",brk:"Break brief",ext:"Extend shot",desc:"Describe look",imp:"Import script"};

function blankShot(order){return{id:uid(),order:order,action:"",vo:"",size:"Medium",angle:"Eye level",move:"Static",lens:35,duration:4,status:"draft",sketch:"",image:"",createdAt:Date.now()}}

function dupShot(){

function delShot(){

function moveShot(dragId,targetId,before){
  if(dragId===targetId)return;

  const rest=S.shots.filter(x=>x.id!==dragId);
  let pos=rest.findIndex(x=>x.id===targetId);if(pos<0)return;if(!before)pos+=1;

function openProject(pid,initial){
  S.unsub.forEach(f=>{try{f()}catch(e){}});S.unsub=[];
  S.pid=pid;S.project=initial||null;S.shots=[];S.shotsLoaded=false;S.sel=null;S.pending={};
  if(location.hash!=="#p-"+pid){try{history.replaceState(null,"","#p-"+pid)}catch(e){location.hash="p-"+pid}}
  S.infl=null;S.products=[];showView("project");renderProject();
  S.products=[];S.unsub.push(Store.subProducts(pid,list=>{if(S.pid!==pid)return;S.products=list;if(!$("#briefPane").contains(document.activeElement))renderBrief();if(!$("#inspector").contains(document.activeElement))renderInspector();renderSB()},()=>{}));
  Store.getRef(pid,"influencer").then(r=>{if(S.pid!==pid)return;S.infl=r||{};renderBrief()});
  const tm=setTimeout(()=>{if(!S.shotsLoaded)banner("Can't reach saved data yet. What you see may be out of date.")},10000);
  S.unsub.push(Store.subProject(pid,(p,meta)=>{
    if(S.pid!==pid)return;
    if(!p){if(meta&&!meta.fromCache&&!S.projPending){toast("That storyboard was deleted.");goHome()}return}
    if(S.projPending)return;
    S.project=p;renderTop();if(!$("#briefPane").contains(document.activeElement))renderBrief();renderViewer();renderMeter();
  },e=>toast("Lost connection to this storyboard.")));
  S.unsub.push(Store.subShots(pid,(list,meta)=>{
    if(S.pid!==pid)return;
    if(!meta||!meta.fromCache){S.shotsLoaded=true;clearTimeout(tm);banner(S.db?"":localNote())}
    const ids=new Set(list.map(s=>s.id));
    const merged=list.map(s=>S.pending[s.id]||s);
    Object.keys(S.pending).forEach(k=>{if(!ids.has(k))merged.push(S.pending[k])});
    merged.sort((a,b)=>a.order-b.order);
    S.shots=merged;
    if(!selShot())S.sel=S.shots[0]?S.shots[0].id:null;
    renderTop();renderViewer();renderSB();
    if(!$("#inspector").contains(document.activeElement))renderInspector();
  },e=>{clearTimeout(tm);toast("Lost connection to the shots.")}));
}

function overlaySVG(s){
  const st=`stroke="#e3c27a" stroke-width="2" fill="none" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"`;
  let g="";
  if(S.guides)g+=`<g stroke="rgba(255,255,255,.16)" stroke-width="1"><line x1="33.33" y1="0" x2="33.33" y2="100" vector-effect="non-scaling-stroke"/><line x1="66.66" y1="0" x2="66.66" y2="100" vector-effect="non-scaling-stroke"/><line x1="0" y1="33.33" x2="100" y2="33.33" vector-effect="non-scaling-stroke"/><line x1="0" y1="66.66" x2="100" y2="66.66" vector-effect="non-scaling-stroke"/></g>`;
  if(S.overlay){
    const m=s.move;const ah=(x1,y1,x2,y2)=>{const a=Math.atan2(y2-y1,x2-x1),L=3.2;return`<path d="M${x1} ${y1} L${x2} ${y2} M${x2-L*Math.cos(a-0.5)} ${y2-L*Math.sin(a-0.5)} L${x2} ${y2} L${x2-L*Math.cos(a+0.5)} ${y2-L*Math.sin(a+0.5)}" ${st}/>`};
    if(m==="Pan left"||m==="Truck left")g+=ah(68,50,32,50);
    else if(m==="Pan right"||m==="Truck right")g+=ah(32,50,68,50);
    else if(m==="Tilt up"||m==="Crane up")g+=ah(50,68,50,32);
    else if(m==="Tilt down"||m==="Crane down")g+=ah(50,32,50,68);
    else if(m==="Dolly in"||m==="Zoom in")g+=`<rect x="25" y="25" width="50" height="50" ${st} stroke-dasharray="3 2"/>`+ah(6,6,22,22)+ah(94,6,78,22)+ah(6,94,22,78)+ah(94,94,78,78);
    else if(m==="Dolly out")g+=`<rect x="25" y="25" width="50" height="50" ${st} stroke-dasharray="3 2"/>`+ah(22,22,6,6)+ah(78,22,94,6)+ah(22,78,6,94)+ah(78,78,94,94);
    else if(m==="Orbit")g+=`<path d="M22 60 A28 12 0 1 0 50 48" ${st}/>`+ah(46,47.4,50,48);
    else if(m==="Handheld")g+=`<path d="M30 50 q3 -4 6 0 t6 0 t6 0 t6 0 t6 0 t6 0" ${st}/>`;
    else if(m==="Drone / aerial")g+=ah(30,72,70,30);
    else if(m==="Turntable 360")g+=`<path d="M30 70 A20 7 0 1 0 50 63" ${st}/>`+ah(46,62.6,50,63);
    else if(m==="Light sweep")g+=`<path d="M10 85 L40 15" ${st} stroke-dasharray="4 3"/><path d="M30 85 L60 15" ${st} stroke-dasharray="4 3"/>`+ah(60,50,88,50);
    else if(m==="Rack focus")g+=`<circle cx="35" cy="50" r="8" ${st}/><circle cx="65" cy="50" r="8" ${st} stroke-dasharray="2 2"/>`+ah(45,50,55,50);
  }
  return `<svg class="ov" viewBox="0 0 100 100" preserveAspectRatio="none">${g}</svg>`;
}

  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("read"))};im.src=url})}

function camGuess(v){v=(v||"").toLowerCase();let size="Medium",angle="Eye level",move="Static",lens=50;
  if(/exterior|signage|showroom|walks|steps in|enters|entrance|floor|laid out|everything/.test(v)){size="Wide";lens=35}
  if(/neckline|holds .* to her|turns for the camera|mirror|tries/.test(v)){size="Medium close-up";lens=50}
  if(/close-?up|detail|lingers|stones|cuts|engrav/.test(v)){size="Close-up";lens=85}
  if(/extreme close|macro|texture/.test(v)){size="Macro";lens=100}
  if(/^(phone|screen)|notes screen|phone screen/.test(v)){size="Insert";lens=50}
  if(/walks|steps in|exits|follows|enters/.test(v))move="Truck right";else if(/turns|holds|picks up/.test(v))move="Handheld";else if(/lingers|close/.test(v))move="Dolly in";
  if(/over (her|his) shoulder/.test(v))angle="Over the shoulder";if(/looking down|tray|counter/.test(v)&&size!=="Wide")angle="High angle";
  return{size,angle,move,lens}}
function parsePrism(txt){

  const clean=x=>String(x||"").trim().replace(/^[“"]+|[”"]+$/g,"").trim();const none=x=>/^[—–-]?$/.test(String(x||"").trim());
  const meta=(txt.match(/Ready\s*[—–-]\s*([^\n]+)/)||[])[1]||"";
  const shots=rows.map(c=>{const m=c[0].match(/(\d+)\s*[–—-]\s*(\d+)/);const dur=Math.max(1,(+m[2])-(+m[1]));const visual=clean(c[1]);
    return normShot(Object.assign({action:visual,dlg:clean(c[2]),vo:none(c[3])?"":clean(c[3]),duration:dur},camGuess(visual)))});
  return{shots,meta}}
function simpleSplit(txt){
  const lines=txt.replace(/\r/g,"").split("\n");const blocks=[];let cur=null;
  const start=/^\s*(?:(?:shot|frame|scene|f|sc)\s*[-#:]?\s*\d+\s*[:.\)\-]?|\d+\s*[\.\):-])\s*/i;
  for(const l of lines){if(start.test(l)){cur=[l.replace(start,"").trim()];blocks.push(cur)}else if(cur&&l.trim())cur.push(l.trim())}

  return blocks.map(b=>{let vo=[],act=[],dur=4;b.forEach(l=>{const m=l.match(/^(super|vo|v\.o\.|voice ?over|text|copy|ost)\s*[:\-]\s*(.*)$/i);if(m)vo.push(m[2]);const d=l.match(/(\d+(?:\.\d+)?)\s*(?:s|sec|secs|seconds)\b/i);if(d)dur=+d[1];if(!m&&l)act.push(l.replace(/[\(\[]?\s*\d+(?:\.\d+)?\s*(?:s|sec|secs|seconds)\b\s*[\)\]]?/i,"").trim())});return normShot({action:act.join(" "),vo:vo.join(" / "),duration:dur})}).filter(x=>x.action||x.vo);
}

viewer.addEventListener("drop",e=>{viewer.classList.remove("drop");if(S.dragId)return;e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)setImage(f)});

/* ---------- events ---------- */
$("#homeBtn").addEventListener("click",()=>{if(S.pid)goHome()});
document.addEventListener("click",e=>{
  const ft=e.target.closest("[data-filter]");if(ft){S.filter=ft.dataset.filter;renderHome();return}
  const open=e.target.closest("[data-open]");if(open){const p=(S.projects||[]).find(x=>x.id===open.dataset.open);openProject(open.dataset.open,p);return}
  const clip=e.target.closest(".clip");if(clip&&!e.target.closest("[data-act]")){S.sel=clip.dataset.id;renderSB.noScroll=true;renderViewer();renderInspector();renderSB();renderSB.noScroll=false;return}
  const ch=e.target.closest("[data-chip]");
  if(ch){const s=selShot();if(!s)return;const k=ch.dataset.chip;const v=k==="lens"?+ch.dataset.v:ch.dataset.v;saveShot(Object.assign({},s,{[k]:v}),300);renderViewer();renderInspector();renderSB();return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a!=="delproj")S.confirmDel=false;
  switch(a){
    case"new":newProjectModal();break;
    case"break":breakBrief();break;
    case"extend":extendShot();break;
    case"add":addShot();break;
    case"dup":dupShot();break;
    case"delshot":delShot();break;
    case"sketch":sketchFrame();break;
    case"upload":$("#fileInput").click();break;
    case"clearframe":{const s=selShot();if(s){saveShot(Object.assign({},s,{image:"",sketch:""}),0);renderProject()}break}
    case"prev":{const i=S.shots.indexOf(selShot());if(i>0){S.sel=S.shots[i-1].id;renderViewer();renderInspector();renderSB()}break}
    case"next":{const i=S.shots.indexOf(selShot());if(i<S.shots.length-1){S.sel=S.shots[i+1].id;renderViewer();renderInspector();renderSB()}break}
    case"guides":S.guides=!S.guides;renderViewer();break;
    case"overlay":S.overlay=!S.overlay;renderViewer();break;
    case"copyprompt":{const s=selShot();if(s)copyText(videoPrompt(s),"Prompt");break}
    case"prompts":copyText(S.shots.map((s,i)=>`Shot ${i+1} (${s.duration}s)\n${videoPrompt(s)}`).join("\n\n"),"All prompts");break;
    case"shotlist":{const pj=S.project||{};const label=pj.kind==="topical"?`${pj.festival||"Topical"}${pj.festDate?" ("+pj.festDate+")":""} · ${TIERS[pj.tier]||""}`:(pj.row||"");const rows=[["Film","Product","#","Start","Duration","Shot size","Angle","Movement","Lens","Action","Super (EN)","QC","Status","Image prompt","Canva frame","Video prompt"]];let t=0;
      S.shots.forEach((s,i)=>{rows.push([label||pj.name,pj.product||"",i+1,fmtTime(t),s.duration+"s",s.size,s.angle,s.move,s.lens+"mm",s.action,s.vo,needsQC(s)?"To QC":"",STATUS[s.status]||s.status,framePrompt(s),s.canvaUrl||"",videoPrompt(s)]);t+=+s.duration||0});
      copyText(rows.map(r=>r.map(c=>String(c).replace(/[\t\n]+/g," ")).join("\t")).join("\n"),"Shot list");break}
    case"present":present();break;
    case"export":exportDeck();break;
    case"addprod":S.fileTarget="prod";$("#fileInput").multiple=true;$("#fileInput").click();break;
    case"share":shareModal();break;
    case"usage":usageModal();break;
    case"copyimg":{const s=selShot();if(s)copyText(framePrompt(s),"Image prompt");break}
    case"frames":{const g=genOf();if(g==="gemini"){geminiModal();break}const rows=S.shots.map((x,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)"><b style="width:28px">${i+1}</b><span class="small" style="flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.size)} · ${esc(x.action||"(no action)")}</span>${frameSrc(x)&&x.image?'<span class="small" style="color:var(--ok)">has frame</span>':""}<a class="btnlink" href="${esc(genLink(x))}" target="_blank" rel="noopener" data-gen="${esc(x.id)}">Open ↗</a><button data-pick="${esc(x.id)}">Paste here</button></div>`).join("");
      openModal(`<h2>Generate frames · ${esc(GENS[g].short)}</h2><p class="muted small" style="margin:0 0 8px">${g==="pollinations"?"Free, no login. Open a shot, right-click the image → Copy image, then press <b>Paste here</b> for that shot. Leave about 15 seconds between shots, because the free tier is rate-limited. All shots share one seed so the look stays close.":`Each Open copies that shot's prompt and opens ${esc(GENS[g].short)}. Attach the influencer photo there once, paste each prompt, then copy the image and press <b>Paste here</b>.`}</p>${rows}<div class="row"><button data-close>Done</button></div>`);break}
    case"importScript":openModal(`<h2>Import PRISM script</h2>
      <ol class="small" style="padding-left:18px;color:var(--muted);line-height:1.6;margin:6px 0 8px"><li>In <a class="lnk" href="https://grtscripts.sbprism.com/" target="_blank" rel="noopener">GRT Script Studio ↗</a>, drag-select the full script table, from <b style="color:var(--text)">TIME</b> down to the last row, then copy it (Ctrl/Cmd+C).</li><li>Paste it below. Storyroom reads each row as a shot: time sets the duration, Visual becomes the action, Dialogue and Super stay word for word, and a camera is suggested from the visual.</li></ol>
      <p class="hint" style="margin:0 0 6px">Or skip the copy-paste: ask Claude in chat to "import the PRISM script open in my browser into ${esc((S.project||{}).name||"this film")}".</p>
      <textarea id="scriptIn" rows="10" placeholder="Paste the PRISM script table here"></textarea>
      <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="scriptReplace" ${S.shots.every(x=>!frameSrc(x)&&x.status==="draft")?"checked":""} style="width:auto"> Replace the current shots</label>
      <div class="row"><button data-close>Cancel</button><button id="scriptSimple">Import as written</button>${S.sample?`<button class="primary" id="scriptAI">✦ Import + Claude picks camera</button>`:""}</div>`);break;
    case"inflPhoto":S.fileTarget="infl";$("#fileInput").click();break;
    case"inflDescribe":describeInfl();break;
    case"delproj":if(!S.confirmDel){S.confirmDel=true;renderBrief();setTimeout(()=>{if(S.confirmDel){S.confirmDel=false;if(S.pid)renderBrief()}},4000)}else{S.confirmDel=false;const pid=S.pid;S.projPending=true;goHome();Store.delProject(pid).then(ok=>{S.projPending=false;if(ok)toast("Storyboard deleted")})}break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.p&&S.project){S.project=Object.assign({},S.project,{[t.dataset.p]:t.value});saveProject();if(t.dataset.p==="aspect")renderViewer();if(t.dataset.p==="kind"){renderBrief();renderTop()}if(t.dataset.p==="gen"){renderBrief();renderInspector()}if(["dress","dressNote","hair","setLoc","tod"].includes(t.dataset.p)){if(t.tagName==="SELECT")renderBrief();renderInspector()}if(t.dataset.p==="product"||t.dataset.p==="row"||t.dataset.p==="festival")renderTop();if(t.dataset.p==="name"||t.dataset.p==="client")renderTop();const pb=$("#promptBox");const s=selShot();if(pb&&s)pb.textContent=videoPrompt(s);return}
  if(t.dataset.s){const s=selShot();if(!s)return;let v=t.value;if(t.dataset.s==="duration"){v=+v;const dv=$("#durV");if(dv)dv.textContent=v+"s"}
    saveShot(Object.assign({},s,{[t.dataset.s]:v}),t.dataset.s==="status"?0:600);renderViewer();renderSB.noScroll=true;renderSB();renderSB.noScroll=false;const pb=$("#promptBox");if(pb)pb.textContent=videoPrompt(selShot())}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.p==="aspect"){renderViewer();renderSB()}});
/* drag reorder */
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".clip");if(!c)return;S.dragId=c.dataset.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",c.dataset.id);e.dataTransfer.effectAllowed="move"}catch(x){}});
document.addEventListener("dragend",()=>{S.dragId=null;document.querySelectorAll(".clip").forEach(c=>c.classList.remove("dragging","dropB","dropA"))});
document.addEventListener("dragover",e=>{if(!S.dragId)return;const c=e.target.closest&&e.target.closest(".clip");if(!c)return;e.preventDefault();const r=c.getBoundingClientRect();const before=e.clientX<r.left+r.width/2;document.querySelectorAll(".clip").forEach(x=>x.classList.remove("dropB","dropA"));c.classList.add(before?"dropB":"dropA")});
document.addEventListener("drop",e=>{if(!S.dragId)return;const c=e.target.closest&&e.target.closest(".clip");if(!c)return;e.preventDefault();const r=c.getBoundingClientRect();const before=e.clientX<r.left+r.width/2;const id=S.dragId;S.dragId=null;moveShot(id,c.dataset.id,before)});
document.addEventListener("keydown",e=>{
  if(P){if(e.key==="Escape")closePresent();else if(e.key===" "){e.preventDefault();P.paused=!P.paused;P.last=performance.now();drawPresent()}else if(e.key==="ArrowRight"){P.i=Math.min(S.shots.length-1,P.i+1);P.el=0;drawPresent()}else if(e.key==="ArrowLeft"){P.i=Math.max(0,P.i-1);P.el=0;drawPresent()}return}
  if(e.key==="Escape"&&!$("#modal").classList.contains("hidden")){closeModal();return}
  if(!S.pid||isTyping()||!$("#modal").classList.contains("hidden"))return;
  const i=S.shots.indexOf(selShot());
  if(e.key==="ArrowRight"&&i<S.shots.length-1){S.sel=S.shots[i+1].id;renderViewer();renderInspector();renderSB()}
  if(e.key==="ArrowLeft"&&i>0){S.sel=S.shots[i-1].id;renderViewer();renderInspector();renderSB()}
});
window.addEventListener("hashchange",route);

/* ---------- boot ---------- */
function localNote(){return"Shared saving isn't available in this view, so storyboards are saved in this browser only."}
function route(){
  const m=location.hash.match(/^#p-([a-z0-9]+)$/i);
  if(m){if(S.pid!==m[1]){const p=(S.projects||[]).find(x=>x.id===m[1]);openProject(m[1],p)}}
  else if(S.pid)goHome();
}
async function boot(){
  renderHome();
  let db=null,sample=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{const r=await Promise.all([window.claude.use("db").catch(()=>null),window.claude.use("sample").catch(()=>null)]);db=r[0];sample=r[1]}catch(e){}
  }
  S.db=db;S.sample=sample;Store=db?DBStore:LocalStore;
  if(!db)banner(localNote());
  const tm=setTimeout(()=>{if(S.projects==null){S.projects=[];renderHome();banner("Can't reach saved storyboards yet. Check your connection; this page keeps trying.")}},10000);
  Store.subProjects(list=>{clearTimeout(tm);S.projects=list;if(!S.pid)renderHome()},e=>{clearTimeout(tm);if(S.projects==null)S.projects=[];if(!S.pid)renderHome();toast("Lost connection to saved storyboards.")});
  route();
  if(S.pid)renderProject();
}
boot();
})();
</script>
</body>
</html>
